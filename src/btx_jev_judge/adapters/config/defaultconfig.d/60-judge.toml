# 60-judge.toml - defaults for `jev-judge run` and `jev-judge summarize`. A CLI flag wins over
# every config layer. The TypeSafe API key is deliberately NOT configurable here: use
# TYPESAFE_API_KEY or ~/.credentials/typesafe.key (mode 600).
#
# Environment override format: BTX_JEV_JUDGE___JUDGE__RATE=5

[judge]
rate = 20.0        # requests per second across all workers; Jev's documented limit is 40
workers = 8
attempts = 4         # tries per judgment, 1 to 10
timeout = 30.0     # seconds per request phase (connect, read, write, pool wait)
cap = 60000        # characters per string in a state
model = "jev-latest"

[summary]
band_low = 0.2
band_high = 0.8
min_confidence = 0.6
